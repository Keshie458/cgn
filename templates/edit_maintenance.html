<h2>Edit Maintenance Log</h2>
<form method="POST">
    <label>Asset:</label><br>
    <select name="asset_id">
        {% for asset in assets %}
            <option value="{{ asset.id }}" {% if asset.id == log.asset_id %}selected{% endif %}>
                {{ asset.name }} ({{ asset.serial_number }})
            </option>
        {% endfor %}
    </select><br>

    <label>Date:</label><br>
    <input type="date" name="date" value="{{ log.date }}"><br>

    <label>Description:</label><br>
    <textarea name="description">{{ log.description }}</textarea><br>

    <label>Cost:</label><br>
    <input type="number" step="0.01" name="cost" value="{{ log.cost }}"><br>

    <label>Service Provider:</label><br>
    <input type="text" name="service_provider" value="{{ log.service_provider }}"><br>

    <label>Status:</label><br>
    <select name="status">
        <option {% if log.status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
        <option {% if log.status == 'Completed' %}selected{% endif %}>Completed</option>
        <option {% if log.status == 'Pending' %}selected{% endif %}>Pending</option>
    </select><br>

    <button type="submit">Update Log</button>
</form>
