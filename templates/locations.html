{% extends 'base.html' %}

{% block title %}Locations{% endblock %}

{% block content %}
    <h2 class="text-2xl font-semibold mb-4">Add Location</h2>
    <form method="POST" class="bg-white p-4 rounded shadow mb-6">
        <label class="block mb-2 font-medium">Name:</label>
        <input type="text" name="name" required class="w-full border p-2 mb-4 rounded">

        <label class="block mb-2 font-medium">Description:</label>
        <textarea name="description" class="w-full border p-2 mb-4 rounded"></textarea>

        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Add</button>
    </form>

    <h3 class="text-xl font-semibold mb-2">All Locations</h3>
    <table class="table-auto w-full bg-white rounded shadow">
        <thead class="bg-gray-200">
            <tr>
                <th class="px-4 py-2 text-left">Name</th>
                <th class="px-4 py-2 text-left">Description</th>
                <th class="px-4 py-2 text-left">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for loc in locations %}
            <tr class="border-t">
                <td class="px-4 py-2">{{ loc.name }}</td>
                <td class="px-4 py-2">{{ loc.description }}</td>
                <td class="px-4 py-2">
                    <a href="/locations/edit/{{ loc.id }}" class="text-blue-600 hover:underline">Edit</a>
                    <form method="POST" action="/locations/delete/{{ loc.id }}" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this location?')" class="text-red-600 hover:underline ml-2">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
