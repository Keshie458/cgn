<!DOCTYPE html>
<html>
<head>
    <title>Locations</title>
</head>
<body>
    <h2>Add Location</h2>
    <form method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" required><br>
        <label>Description:</label><br>
        <textarea name="description"></textarea><br>
        <button type="submit">Add</button>
    </form>

    <h3>All Locations</h3>
    <table border="1">
        <tr><th>Name</th><th>Description</th></tr>
        {% for loc in locations %}
        <tr>
            <td>{{ loc.name }}</td>
            <td>{{ loc.description }}</td>
            <td>
    <a href="/locations/edit/{{ loc.id }}">Edit</a>
    <form method="POST" action="/locations/delete/{{ loc.id }}" style="display:inline;">
        <button type="submit" onclick="return confirm('Are you sure you want to delete this location?')">Delete</button>
    </form>
</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
