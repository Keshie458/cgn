{% extends 'base.html' %}

{% block title %}CGN AMS - Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow login-container">
  <h2 class="text-2xl font-semibold mb-4 text-center text-green-700">Login</h2>
  <form method="POST" aria-label="Login form" class="space-y-4">
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700">Username:</label>
      <input id="username" type="text" name="username" required autocomplete="username"
             placeholder="Enter your username"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
      <input id="password" type="password" name="password" required autocomplete="current-password"
             placeholder="Enter your password"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
    </div>

    <button type="submit"
            class="w-full bg-green-700 text-white py-2 px-4 rounded hover:bg-green-800 transition">
      Login
    </button>
  </form>

  <div class="mt-4 text-center text-sm text-gray-600">
    <a href="#" class="hover:underline">Forgot password?</a>
  </div>
</div>
{% endblock %}
