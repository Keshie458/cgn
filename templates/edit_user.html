{% extends 'base.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="p-4 sm:p-6 lg:p-8 bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
        
        
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Edit User</h1>
            <p class="text-gray-600">Update user details for <span class="font-semibold">{{ user.username }}</span></p>
        </div>

       
        <form method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username:</label>
                <input type="text" id="username" name="username" value="{{ user.username }}" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="fullname" class="block text-sm font-medium text-gray-700">Full name:</label>
                <input type="text" id="fullname" name="fullname" value="{{ user.full_name }}" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">New Password:</label>
                <input type="password" id="password" name="password" placeholder="Leave blank to keep current password" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700">Role:</label>
                <select id="role" name="role" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
                    <option value="Staff" {% if user.role == 'Staff' %}selected{% endif %}>Staff</option>
                </select>
            </div>

            <div>
                <label for="department_id" class="block text-sm font-medium text-gray-700">Department:</label>
                <select id="department_id" name="department_id" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    {% for dept in departments %}
                        <option value="{{ dept.id }}" {% if dept.id == user.department_id %}selected{% endif %}>{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex items-center justify-between pt-4">
                <a href="{{ url_for('users.manage_users') }}" class="w-auto px-6 py-2 text-center text-sm font-medium text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                    Cancel
                </a>
                <button type="submit" class="w-auto flex justify-center py-2 px-6 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Update User
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
