<!DOCTYPE html>
<html>
<head>
    <title>Asset Categories</title>
</head>
<body>
    <h2>Add Asset Category</h2>
    <form method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" required><br>
        <label>Description:</label><br>
        <textarea name="description"></textarea><br>
        <button type="submit">Add Category</button>
    </form>

    <h3>All Categories</h3>
    <table border="1">
        <tr><th>Name</th><th>Description</th></tr>
        {% for cat in categories %}
        <tr>
            <td>{{ cat.name }}</td>
            <td>{{ cat.description }}</td>
            <td>
    <a href="/categories/edit/{{ cat.id }}">Edit</a>
    <form method="POST" action="/categories/delete/{{ cat.id }}" style="display:inline;">
        <button type="submit" onclick="return confirm('Are you sure you want to delete this category?')">Delete</button>
    </form>
</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
