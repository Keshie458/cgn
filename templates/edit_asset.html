{% extends 'base.html' %}

{% block title %}Edit Asset{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-semibold mb-6 text-green-700 text-center">Edit Asset</h2>
  <form method="POST" class="space-y-4">


    <div>
      <label class="block text-sm font-medium text-gray-700">Name:</label>
      <input type="text" name="name" value="{{ asset.name }}" required
             class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Description:</label>
      <textarea name="description"
                class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">{{ asset.description }}</textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Serial Number:</label>
      <input type="text" name="serial_number" value="{{ asset.serial_number }}" required
             class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Status:</label>
      <select name="status"
              class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
        <option {% if asset.status == 'In Use' %}selected{% endif %}>In Use</option>
        <option {% if asset.status == 'Under Repair' %}selected{% endif %}>Under Repair</option>
        <option {% if asset.status == 'Disposed' %}selected{% endif %}>Disposed</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Purchase Date:</label>
      <input type="date" name="purchase_date" value="{{ asset.purchase_date }}"
             class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Warranty Expiry:</label>
      <input type="date" name="warranty_expiry" value="{{ asset.warranty_expiry }}"
             class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Category:</label>
      <select name="category_id"
              class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
        {% for cat in categories %}
          <option value="{{ cat.id }}" {% if cat.id == asset.category_id %}selected{% endif %}>{{ cat.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Department:</label>
      <select name="department_id"
              class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
        {% for dept in departments %}
          <option value="{{ dept.id }}" {% if dept.id == asset.department_id %}selected{% endif %}>{{ dept.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Location:</label>
      <select name="location_id"
              class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
        {% for loc in locations %}
          <option value="{{ loc.id }}" {% if loc.id == asset.location_id %}selected{% endif %}>{{ loc.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="text-center">
      <button type="submit"
              class="bg-green-700 text-white px-6 py-2 rounded hover:bg-green-800 transition">
        Update Asset
      </button>
    </div>
  </form>
</div>
{% endblock %}
