{% extends 'base.html' %}

{% block title %}Create New User{% endblock %}

{% block content %}
<div class="p-4 sm:p-6 lg:p-8 bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
        
        <!-- Page Header -->
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Create New User</h1>
            <p class="text-gray-600">Set up a new account with the required details.</p>
        </div>

        <!-- Create User Form -->
        <form method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username:</label>
                <input type="text" id="username" name="username" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="full_name" class="block text-sm font-medium text-gray-700">Full Name:</label>
                <input type="text" id="full_name" name="full_name" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
                <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700">Role:</label>
                <select id="role" name="role" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="Admin">Admin</option>
                    <option value="Staff" selected>Staff</option>
                </select>
            </div>

            <div>
                <label for="department_id" class="block text-sm font-medium text-gray-700">Department:</label>
                <select id="department_id" name="department_id" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Create User
                </button>
            </div>
             <div class="text-center mt-4">
                <a href="{{ url_for('users.manage_users') }}" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                    &larr; Back to User List
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
