{% extends 'base.html' %}

{% block title %}Edit Asset Category{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12 p-8 bg-white rounded-xl shadow-lg">
    <h2 class="text-3xl font-bold text-gray-900 mb-6 text-center">Edit Asset Category</h2>
    <form method="POST" class="space-y-6">
        <div>
            <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Name</label>
            <input type="text" id="name" name="name" value="{{ category.name }}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200">
        </div>

        <div>
            <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
            <textarea id="description" name="description" rows="4"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200">{{ category.description }}</textarea>
        </div>

        <div>
            <button type="submit"
                    class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-indigo-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Update Category
            </button>
        </div>
    </form>
</div>
{% endblock %}
