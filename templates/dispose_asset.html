{% extends 'base.html' %}

{% block title %}Dispose Asset: {{ asset.name }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-semibold mb-6 text-red-700 text-center">Dispose Asset: {{ asset.name }}</h2>
  <form method="POST" class="space-y-4">
    

    <div>
      <label for="disposal_date" class="block text-sm font-medium text-gray-700">Disposal Date:</label>
      <input type="date" id="disposal_date" name="disposal_date" required
             class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-red-500 focus:border-red-500">
    </div>

    <div>
      <label for="disposal_method" class="block text-sm font-medium text-gray-700">Disposal Method:</label>
      <select id="disposal_method" name="disposal_method"
              class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-red-500 focus:border-red-500">
        <option value="Sold">Sold</option>
        <option value="Donated">Donated</option>
        <option value="Scrapped">Scrapped</option>
        <option value="Written Off">Written Off</option>
      </select>
    </div>

    <div>
      <label for="disposal_reason" class="block text-sm font-medium text-gray-700">Reason:</label>
      <textarea id="disposal_reason" name="disposal_reason" required
                class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-red-500 focus:border-red-500"
                placeholder="Explain why this asset is being disposed">{{ asset.disposal_reason }}</textarea>
    </div>

    <div class="text-center">
      <button type="submit"
              class="bg-red-700 text-white px-6 py-2 rounded hover:bg-red-800 transition">
        Confirm Disposal
      </button>
    </div>
  </form>
</div>
{% endblock %}
